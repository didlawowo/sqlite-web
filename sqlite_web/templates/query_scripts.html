<script type="text/javascript">
  $(function() {
    /* Recent queries and bookmarks. */
    var sql = {% if sql and not error %}{{ sql|tojson }}{% else %}''{% endif %};
    var Recent = new App.Recent();
    Recent.initialize(sql);

    var bookmarks = new App.Bookmarks();
    bookmarks.initialize({
      table: {{ (table or '')|tojson }},
      queryUrl: {{ url_for('generic_query')|tojson }},
      tableQueryUrl: {{ url_for('table_query', table='__TABLE__')|tojson }}
    });
  });
</script>
